    <text x="197" y="543" fill="#C8FF3D" font-family="DejaVu Sans Mono, monospace" font-size="9">→</text>
    <text x="216" y="543" fill="#F4F7FB" font-family="DejaVu Sans Mono, monospace" font-size="9">EXPERIMENT</text>
    <text x="307" y="543" fill="#C8FF3D" font-family="DejaVu Sans Mono, monospace" font-size="9">→</text>
    <text x="326" y="543" fill="#F4F7FB" font-family="DejaVu Sans Mono, monospace" font-size="9">IMPROVE</text>
    <text x="1159" y="543" text-anchor="end" fill="#C8FF3D" font-family="DejaVu Sans Mono, monospace" font-size="9" font-weight="700">[READY]</text>
