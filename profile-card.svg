<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Akhilesh Jain — Computer Science, AI/ML, Generative AI</title>
  <desc id="desc">A premium dark technical profile card for Akhilesh Jain, featuring a software architecture diagram and developer code panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="1" stop-color="#0B1322"/>
    </linearGradient>
    <linearGradient id="limeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8FF3D" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#C8FF3D" stop-opacity=".9"/>
      <stop offset="1" stop-color="#73D7FF" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C2D"/>
      <stop offset="1" stop-color="#0B1322"/>
    </linearGradient>
    <filter id="glowLime" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
