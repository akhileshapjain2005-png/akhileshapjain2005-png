      <text x="98" y="363" fill="#8EA3BD">    </text><text x="118" y="363" fill="#C8FF3D">domain</text><text x="174" y="363" fill="#8EA3BD"> = </text><text x="193" y="363" fill="#79E34B">"Computer Science"</text>

